<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频历史存档 | video</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --container-bg: white; --text-color: #333;
            --nav-bg: white; --nav-text: #333; --border-color: rgba(0,0,0,0.1);
        }
        .dark-mode {
            --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            --container-bg: #1a1a2e; --text-color: #e0e0e0;
            --nav-bg: #1f1f38; --nav-text: #e0e0e0; --border-color: rgba(255,255,255,0.1);
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-gradient); min-height: 100vh; padding: 20px; color: var(--text-color); transition: background 0.3s, color 0.3s; }
        .container { max-width: 800px; margin: 0 auto; background: var(--container-bg); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); overflow: hidden; transition: background 0.3s, color 0.3s; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 30px; background: var(--nav-bg); border-bottom: 1px solid var(--border-color); }
        .nav-brand { font-size: 1.5em; font-weight: bold; background: var(--bg-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .nav-links { display: flex; gap: 20px; list-style: none; }
        .nav-links a { color: var(--nav-text); text-decoration: none; font-size: 1em; transition: opacity 0.3s; }
        .nav-links a:hover { opacity: 0.7; }
        .content { padding: 40px 30px; }
        h1 { font-size: 2em; margin-bottom: 30px; background: var(--bg-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .year-section { margin-bottom: 40px; }
        .year-title { font-size: 1.5em; margin-bottom: 15px; color: var(--text-color); border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
        .month-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .month-card { background: var(--container-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; text-align: center; transition: transform 0.3s, box-shadow 0.3s; }
        .month-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .month-card a { text-decoration: none; color: var(--text-color); display: block; }
        .month-card .month-icon { font-size: 2.5em; margin-bottom: 10px; }
        .month-card .month-name { font-size: 1.2em; font-weight: bold; margin-bottom: 5px; }
        .month-card .month-count { font-size: 0.9em; opacity: 0.6; }
        footer { background: var(--nav-bg); padding: 20px; text-align: center; color: var(--text-color); font-size: 0.9em; border-top: 1px solid var(--border-color); opacity: 0.7; }
        footer a { color: #667eea; text-decoration: none; }
        @media(max-width:600px) { .navbar { flex-direction: column; gap: 10px; } .month-grid { grid-template-columns: 1fr 1fr; } }
        .toggle-btn { background: var(--bg-gradient); color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="nav-brand">🎬 视频存档</div>
            <ul class="nav-links">
                <li><a href="/video/">首页</a></li>
                <li><a href="/video/history/2026/06/">2026年6月</a></li>
                <li><a href="/video/about.html">关于</a></li>
            </ul>
            <button class="toggle-btn" onclick="document.body.classList.toggle('dark-mode')">🌓 切换主题</button>
        </nav>
        <div class="content">
            <h1>📅 视频历史存档</h1>
            <div class="year-section">
                <div class="year-title">📆 2026年</div>
                <div class="month-grid">
                    <div class="month-card">
                        <a href="/video/history/2026/05/">
                            <div class="month-icon">📅</div>
                            <div class="month-name">5月</div>
                            <div class="month-count">5月18日 - 5月31日</div>
                        </a>
                    </div>
                    <div class="month-card">
                        <a href="/video/history/2026/06/">
                            <div class="month-icon">📅</div>
                            <div class="month-name">6月</div>
                            <div class="month-count">6月1日 - 6月8日</div>
                        </a>
                    </div>
                    <div class="month-card">
                        <a href="/video/history/2026/07/">
                            <div class="month-icon">⚽</div>
                            <div class="month-name">7月</div>
                            <div class="month-count">7月1日 - 世界杯</div>
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <footer>
            <p>🎬 视频存档 | <a href="/video/">返回首页</a></p>
        </footer>
    </div>
</body>
</html>
