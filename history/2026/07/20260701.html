        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; }
        .navbar { background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }

        .video-grid { display: grid; gap: 24px; margin-top: 20px; }
        .video-card { background: var(--card-bg); border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,0.06); }
        .video-card video { width: 100%; height: auto; max-height: 400px; display: block; background: #000; }
        .video-info { padding: 18px 20px; }
        .video-number { display: inline-block; background: var(--accent); color: #fff; padding: 3px 12px; border-radius: 12px; font-size: 0.8em; margin-bottom: 8px; }
        .video-title { font-size: 1.2em; font-weight: bold; margin-bottom: 6px; }
        .video-desc { opacity: 0.7; font-size: 0.9em; }
        .tag { display: inline-block; background: var(--tag-bg); color: var(--tag-color); padding: 3px 10px; border-radius: 10px; font-size: 0.8em; margin-right: 5px; }
        .back-link { display: inline-block; margin-top: 20px; color: var(--accent); text-decoration: none; font-size: 0.9em; }
        footer { text-align: center; padding: 30px; opacity: 0.5; font-size: 0.85em; }
