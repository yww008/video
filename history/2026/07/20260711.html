<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ 世界杯集锦 — 2026年7月11日</title>
    <meta name="description" content="2026世界杯1/4决赛：西班牙2-1比利时，6个精彩片段">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-gradient: linear-gradient(135deg, #1a3a4a 0%, #2d6a7a 100%);
            --container-bg: white; --text-color: #333;
            --footer-bg: #f0f6f8; --footer-color: #6c757d;
            --nav-bg: white; --nav-text: #333; --border-color: rgba(0,0,0,0.1);
        }
        .dark-mode {
            --bg-gradient: linear-gradient(135deg, #0a1a2a 0%, #1a3a4a 100%);
            --container-bg: #0a1a2a; --text-color: #c0dae0;
            --footer-bg: #0a1a2a; --footer-color: #8090a0;
            --nav-bg: #1a2a3a; --nav-text: #c0dae0; --border-color: rgba(255,255,255,0.1);
        }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.8; background: linear-gradient(135deg, #0d1b2a 0%, #1b3a4a 100%); min-height: 100vh; color: var(--text-color); }
        .container { max-width: 1200px; margin: 0 auto; }
        .navbar { background: rgba(255,255,255,0.95); padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); }
        .navbar-brand { font-size: 1.5em; font-weight: bold; color: var(--nav-text); text-decoration: none; }
        .nav-links { display: flex; gap: 20px; list-style: none; }
        .nav-links a { color: var(--nav-text); text-decoration: none; font-weight: 500; }
        .cover-section { position: relative; width: 100%; height: 500px; overflow: hidden; }
        .cover-image { width: 100%; height: 100%; object-fit: cover; }
        .cover-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.8), transparent); padding: 60px 30px; color: white; }
        .cover-title { font-size: 3em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .cover-subtitle { font-size: 1.3em; opacity: 0.9; }
        .content { padding: 40px 30px; background: var(--container-bg); border-radius: 0 0 16px 16px; }
        .match-list { margin-top: 30px; }
        .match-item { background: var(--container-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; margin-bottom: 20px; }
        .match-header { display: flex; align-items: center; gap: 20px; margin-bottom: 15px; }
        .match-teams { font-size: 1.5em; font-weight: bold; }
        .match-detail { color: var(--footer-color); margin-top: 5px; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; margin-top: 15px; }
        .video-card { background: var(--container-bg); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; transition: transform 0.2s; }
        .video-card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .video-card video { width: 100%; height: 200px; object-fit: cover; background: #000; }
        .video-label { padding: 8px 12px; font-size: 0.9em; color: var(--footer-color); text-align: center; }
        .dark-mode .video-card { background: #1a2a3a; border-color: rgba(255,255,255,0.1); }
        footer { background: var(--footer-bg); padding: 30px; text-align: center; color: var(--footer-color); border-radius: 0 0 16px 16px; }
        footer a { color: #2d6a7a; text-decoration: none; }
        @media(max-width: 768px) { .cover-section { height: 300px; } .cover-title { font-size: 2em; } .nav-links { display: none; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="navbar-brand">⚽ 世界杯集锦</a>
        <ul class="nav-links">
            <li><a href="index.html">首页</a></li>
            <li><a href="about.html">关于</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="cover-section">
            <img src="https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=1200" alt="World Cup 2026" class="cover-image">
            <div class="cover-overlay">
                <h1 class="cover-title">⚽ 世界杯集锦</h1>
                <p class="cover-subtitle">2026年7月11日 — 1/4决赛</p>
            </div>
        </div>

        <div class="content">
            <h2 style="margin-bottom:20px;">📅 7月11日比赛录像</h2>
            <div class="match-list">
                <div class="match-item">
                    <div class="match-header">
                        <div>
                            <div class="match-teams">🇪🇸 西班牙 2 - 1 比利时</div>
                            <div class="match-detail">1/4决赛 · 6个精彩片段</div>
                        </div>
                    </div>
                    <div class="video-grid">
                        <div class="video-card"><video controls playsinline><source src="https://raw.githubusercontent.com/yww008main/videos/backup_upload/worldcup11_sp_01.mp4" type="video/mp4"></video><div class="video-label">片段 01</div></div>
                        <div class="video-card"><video controls playsinline><source src="https://raw.githubusercontent.com/yww008main/videos/backup_upload/worldcup11_sp_02.mp4" type="video/mp4"></video><div class="video-label">片段 02</div></div>
                        <div class="video-card"><video controls playsinline><source src="https://raw.githubusercontent.com/yww008main/videos/backup_upload/worldcup11_sp_03.mp4" type="video/mp4"></video><div class="video-label">片段 03</div></div>
                        <div class="video-card"><video controls playsinline><source src="https://raw.githubusercontent.com/yww008main/videos/backup_upload/worldcup11_sp_04.mp4" type="video/mp4"></video><div class="video-label">片段 04</div></div>
                        <div class="video-card"><video controls playsinline><source src="https://raw.githubusercontent.com/yww008main/videos/backup_upload/worldcup11_sp_05.mp4" type="video/mp4"></video><div class="video-label">片段 05</div></div>
                        <div class="video-card"><video controls playsinline><source src="https://raw.githubusercontent.com/yww008main/videos/backup_upload/worldcup11_sp_06.mp4" type="video/mp4"></video><div class="video-label">片段 06</div></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>⚽ 世界杯集锦视频 · 2026</p>
        <p><a href="index.html">← 返回首页</a></p>
    </footer>

    <script>
        const toggleBtn = document.createElement('button');
        toggleBtn.textContent = '🌓 深色模式';
        toggleBtn.style.cssText = 'position:fixed;bottom:20px;right:20px;padding:10px 16px;background:#2d6a7a;color:white;border:none;border-radius:8px;cursor:pointer;z-index:1000;';
        toggleBtn.onclick = () => { document.body.classList.toggle('dark-mode'); localStorage.setItem('darkMode', document.body.classList.contains('dark-mode')); };
        if (localStorage.getItem('darkMode') === 'true') document.body.classList.add('dark-mode');
        document.body.appendChild(toggleBtn);
    </script>
</body>
</html>
